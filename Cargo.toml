[package]
name = "sticky"
version = "0.1.0"
edition = "2024"
default-run = "sticky"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
markdown = "1"

# TUI
crossterm = "0.29"
ratatui = "0.29"

# GTK
gtk4 = "0.10"
glib = "0.21"

clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
